<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Camera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'base.html' %}
    <div class="container">
        <h2>Edit Camera</h2>
        <form action="{{ url_for('edit_camera', camera_id=camera.id) }}" method="POST">
            <div class="form-group">
                <label for="name">Camera Name:</label>
                <input type="text" id="name" name="name" value="{{ camera.name }}" required>
            </div>
            <div class="form-group">
                <label for="ip">Camera IP:</label>
                <input type="text" id="ip" name="ip" value="{{ camera.ip }}" required>
            </div>
            <button type="submit">Save Changes</button>
        </form>
        <a href="{{ url_for('cameras') }}">Back to Cameras</a>
    </div>
</body>
</html>
