<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cameras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'base.html' %}
    <div class="container">
        <h1>Cameras</h1>
        <a href="{{ url_for('add_camera') }}" class="btn">Add Camera</a>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>IP Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for camera in cameras %}
                <tr>
                    <td>{{ camera.name }}</td>
                    <td>{{ camera.ip }}</td>
                    <td>
                        <a href="{{ url_for('edit_camera', camera_id=camera.id) }}" class="btn">Edit</a>
                        <a href="{{ url_for('delete_camera', camera_id=camera.id) }}" class="btn">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
